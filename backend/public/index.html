<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 700px;
      width: 100%;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 3rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #38bdf8;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 1.5rem;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #0ea5e9;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #64748b;
    }

    code {
      background: #1e293b;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Server Running 🚀</h1>

     <p>
      This is the default <code>public/index.html</code> page.
      Replace this file with your frontend build output later.
    </p>

    <a class="btn" href="/api/health">
      Test API Route
    </a>

    <div id="desc" class="footer">
      APP_NAME
    </div>
  </div>

  <script>
    fetch('/api/health/app-info')
      .then(res => res.json())
      .then(data => {
        document.getElementById('desc').textContent = data.description;
      });
  </script>
</body>
</html>
